# Large model configuration for best performance

model:
  d_model: 512
  n_layers: 12
  n_heads: 16
  d_ff: 2048
  dropout: 0.1
  cross_world_layers: [4, 8, 10]
  attend_to_all_worlds: true
  use_gradient_checkpointing: true

training:
  batch_size: 16
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 2000
  max_steps: 200000

loss:
  lambda_delta: 1.0
  use_quantiles: true

optimization:
  use_mixed_precision: true
  max_grad_norm: 1.0

data:
  num_workers: 8

logging:
  log_every: 100
  eval_every: 2000
  save_every: 10000
  use_wandb: true

checkpoint_dir: "checkpoints/large"
device: "cuda"
