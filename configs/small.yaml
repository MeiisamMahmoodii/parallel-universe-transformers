# Small model configuration for quick experiments

model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 512
  dropout: 0.1
  cross_world_layers: [2, 3]
  attend_to_all_worlds: true

training:
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  max_steps: 20000

loss:
  lambda_delta: 1.0

optimization:
  use_mixed_precision: true

logging:
  log_every: 50
  eval_every: 500
  save_every: 2000

checkpoint_dir: "checkpoints/small"
device: "cuda"
